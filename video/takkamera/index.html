    <style>
      :root {
        --ground: #14171C;
        --ink: #F4F6FA;
        --dim: #9AA3B2;
        --gul: #F4C430;
        --rod: #FF4D5A;
        --font-display: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1920px; height: 1080px; font-family: var(--font-display); color: var(--ink); overflow: hidden; }
      .full { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #hud-venstre { position: absolute; left: 60px; top: 56px; width: 380px; }
      #hud-venstre .tittel { font-family: var(--font-mono); font-weight: 700; font-size: 24px; letter-spacing: 0.06em; }
      #hud-venstre .under { font-family: var(--font-mono); font-size: 18px; color: var(--dim); margin-top: 6px; }
      #teller { margin-top: 34px; background: rgba(10,12,16,0.78); border: 1px solid #343B48; border-radius: 10px; padding: 18px 22px; }
      #teller .etikett { font-size: 18px; color: var(--dim); }
      #teller .tall { font-family: var(--font-mono); font-weight: 700; font-size: 84px; line-height: 1; margin-top: 6px; }
      #hud-hoyre { position: absolute; right: 60px; top: 56px; width: 380px; text-align: right; font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.06em; }
      #rec-prikk { display: inline-block; width: 16px; height: 16px; border-radius: 50%; background: var(--rod); margin-right: 12px; vertical-align: middle; }
      #bunntekst { position: absolute; left: 60px; bottom: 44px; font-family: var(--font-mono); font-size: 16px; color: var(--dim); letter-spacing: 0.04em; }
      #vignett { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(0,0,0,0.62) 100%); }
      #skanning { position: absolute; left: 0; top: 0; width: 1920px; height: 6px; background: linear-gradient(rgba(34,211,238,0), rgba(34,211,238,0.5), rgba(34,211,238,0)); opacity: 0; }
      #svart { background: #000; }
      #matcher { position: absolute; left: 1500px; top: 560px; width: 370px; background: rgba(10,12,16,0.9); border: 1px solid #343B48; border-radius: 12px; padding: 20px 22px; }
      #matcher .topp { font-family: var(--font-mono); font-weight: 700; font-size: 16px; letter-spacing: 0.1em; color: var(--dim); }
      #matcher .linje { font-size: 22px; margin-top: 12px; line-height: 1.25; }
      #matcher .bar { margin-top: 14px; height: 10px; border-radius: 5px; background: #272D38; overflow: hidden; }
      #matcher #bar-fyll { height: 100%; width: 100%; background: var(--gul); transform-origin: left center; }
      #matcher .sek { font-family: var(--font-mono); font-size: 20px; color: var(--gul); margin-top: 8px; }
      #avvik { margin-top: 16px; background: var(--rod); color: #1A0508; border-radius: 8px; padding: 14px 16px; }
      #avvik .a1 { font-weight: 800; font-size: 24px; }
      #avvik .a2 { font-size: 19px; margin-top: 4px; font-weight: 600; }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      const TX = 1151, TY = 465;

      // Åpning
      tl.fromTo("#svart", { opacity: 1 }, { opacity: 0, duration: 0.9, ease: "power2.out" }, 0);
      tl.fromTo("#hud-venstre, #hud-hoyre", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.4);
      tl.fromTo("#skanning", { opacity: 1, y: 0 }, { opacity: 1, y: 1080, duration: 1.4, ease: "none" }, 0.5);
      tl.set("#skanning", { opacity: 0 }, 2.0);
      tl.fromTo("#sone", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 1.0);

      // Tidskode og blinkende REC-prikk
      for (let s = 0; s <= 16; s++) {
        const m = String(Math.floor(s / 60)).padStart(2, "0"), ss = String(s % 60).padStart(2, "0");
        tl.set("#tidskode", { textContent: m + ":" + ss }, s);
        tl.set("#rec-prikk", { opacity: s % 2 === 0 ? 1 : 0.25 }, s);
      }

      // Segmentering av boksene, én etter én
      for (let i = 1; i <= 12; i++) {
        const t = 1.8 + (i - 1) * 0.16;
        tl.fromTo("#maske-" + i, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t);
        tl.set("#antall", { textContent: String(i) }, t + 0.1);
      }

      // Arbeideren kommer inn fra høyre
      gsap.set("#arbeider", { x: 2150, y: 700 });
      tl.to("#arbeider", { x: 1500, y: 540, duration: 1.8, ease: "power1.out" }, 4.2);
      tl.fromTo("#maske-person", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 4.9);

      // Rekker ut og griper boksen
      const hendene = { duration: 1.0, ease: "power2.inOut" };
      tl.to("#arm-o", { attr: { x2: -172, y2: -45 }, ...hendene }, 6.1);
      tl.to("#hand-o", { attr: { cx: -172, cy: -45 }, ...hendene }, 6.1);
      tl.to("#arm-n", { attr: { x2: -172, y2: 45 }, ...hendene }, 6.1);
      tl.to("#hand-n", { attr: { cx: -172, cy: 45 }, ...hendene }, 6.1);
      tl.to("#skygge-8", { opacity: 0.45, duration: 0.5 }, 7.2);
      tl.to("#boks-8", { scale: 1.07, svgOrigin: (TX + 85) + " " + (TY + 75), duration: 0.5, ease: "power2.out" }, 7.2);

      // Går ut av sonen med boksen
      tl.to("#arbeider", { x: 2300, duration: 2.8, ease: "none" }, 7.8);
      tl.to("#boks-8", { x: 800, duration: 2.8, ease: "none" }, 7.8);

      // Boksen forlater sonen: telleren faller, avviket vises
      tl.set("#antall", { textContent: "11" }, 8.9);
      tl.fromTo("#antall", { color: "#F4F6FA" }, { color: "#FF4D5A", duration: 0.3 }, 8.9);
      tl.fromTo("#tomplass", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 8.9);
      tl.to("#tomplass", { opacity: 0.45, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, 9.4);

      // Matcheren leter etter skanning
      tl.fromTo("#matcher", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 9.6);
      tl.fromTo("#bar-fyll", { scaleX: 1 }, { scaleX: 0, duration: 1.6, ease: "none" }, 10.2);
      for (let k = 0; k <= 15; k++) {
        tl.set("#sek", { textContent: (15 - k) + " s (spolet)" }, 10.2 + k * (1.6 / 15));
      }
      tl.set("#m-linje2", { textContent: "Ingen skanning funnet" }, 11.8);
      tl.set("#avvik", { display: "block" }, 11.9);
      tl.fromTo("#avvik", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, 11.9);

      // Avslutning
      tl.to("#svart", { opacity: 1, duration: 0.8, ease: "power2.in" }, 15.2);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
